<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexa-ERP-Cloud — Connexion</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="js/i18n.js"></script>
</head>
<body class="login-page">
    <div class="login-box">
       <div class="login-logo">
        <h1>Nexa-ERP-Cloud</h1>
        <p>Votre gestion, Notre solution</p> 
       </div> 
        <form id="login-form"> 
            <div class="form-group">
                <label for="email">Email professionnel</label>
                <input type="email" id="email" name="email" placeholder="admin@nexa.local">
            </div>
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" placeholder="••••••••">
            </div>
            <p id="error-msg" style="color: red; display:none"></p>
            <button type="submit" class="btn-login"><i class="fa-solid fa-right-to-bracket"></i> Se connecter</button>
            <div class="login-footer">
                <p>Pas encore de compte ?</p>
                <a href="register.html" class="btn-register">
                 Créer un espace entreprise →
                </a>
            </div>
            <!-- LIEN VERS L'INSCRIPTION SAAS -->
            <div style="margin-top: 18px; text-align: center; border-top: 1px solid #e2e8f0; padding-top: 14px;">
                <span style="font-size: 13px; color: #64748b;">Nouvelle entreprise ?</span>
                <a href="register.html" style="color: #1a73e8; font-weight: 600; font-size: 13px; text-decoration: none; margin-left: 5px;">
                    Créer un compte ERP &rarr;
                </a>
            </div>
        </form>
    </div>

<script src="js/auth.js"></script>
</body>
</html>
