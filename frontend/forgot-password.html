<form id="forgot-form">
  <label for="email">Adresse e-mail</label>
  <input id="email" type="email" required>

  <label for="tenant-id">Identifiant de l'entreprise</label>
  <input id="tenant-id" required placeholder="ex. nom-entreprise">

  <button type="submit">Recevoir le lien de réinitialisation</button>
  <p id="message" aria-live="polite"></p>
</form>

<script>
const API =
  location.hostname === "localhost" || location.hostname === "127.0.0.1"
    ? "http://127.0.0.1:8000"
    : location.origin;

document.getElementById("forgot-form").addEventListener("submit", async (event) => {
  event.preventDefault();

  const message = document.getElementById("message");
  message.textContent = "Envoi en cours…";

  try {
    const response = await fetch(`${API}/auth/forgot-password`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        email: document.getElementById("email").value.trim(),
        tenant_id: document.getElementById("tenant-id").value.trim()
      })
    });

    const data = await response.json();
    message.textContent = data.message || "Demande traitée.";
  } catch {
    message.textContent = "Impossible de contacter le serveur.";
  }
});
</script>
