<form id="reset-form">
  <label for="password">Nouveau mot de passe (08 caractères minimum)</label>
  <input id="password" type="password" minlength="12" required>

  <button type="submit">Changer le mot de passe</button>
  <p id="message" aria-live="polite"></p>
</form>

<script>
const API =
  location.hostname === "localhost" || location.hostname === "127.0.0.1"
    ? "http://127.0.0.1:8000"
    : location.origin;

document.getElementById("reset-form").addEventListener("submit", async (event) => {
  event.preventDefault();

  const message = document.getElementById("message");
  const token = new URLSearchParams(location.search).get("token");

  if (!token) {
    message.textContent = "Le lien ne contient pas de jeton valide.";
    return;
  }

  try {
    const response = await fetch(`${API}/auth/reset-password`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        token,
        new_password: document.getElementById("password").value
      })
    });

    const data = await response.json();
    message.textContent = response.ok
      ? `${data.message} Vous pouvez maintenant vous connecter.`
      : (data.detail || "Lien invalide ou expiré.");
  } catch {
    message.textContent = "Impossible de contacter le serveur.";
  }
});
</script>
